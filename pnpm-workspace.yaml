packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': true
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true
# Les bibliothèques React Native (react-native-svg, React Navigation) importent
# `react` sans dépendre de `@types/react` : TypeScript ne trouve ses types que
# s'il est remonté à la racine. pnpm 11 ignore `shamefully-hoist` de `.npmrc`.
publicHoistPattern:
  - '@types/react'
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.13'
  - '@expo/metro-config@58.0.15'
  - '@expo/router-server@58.0.15'
  - babel-preset-expo@58.0.18
  - expo-asset@58.0.17
  - expo-file-system@58.0.10
  - expo-font@58.0.9
  - expo-modules-cli@0.3.1
  - expo-modules-core@58.0.23
  - expo-modules-jsi@58.0.16
  - expo@58.0.16
  - expo-router@58.0.24
