name: CI

"on":
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Lint
        working-directory: apps/api
        run: npm run lint:ci

      - name: Type check
        working-directory: apps/api
        run: npm run type-check

      - name: Test
        working-directory: apps/api
        run: npm run test

      - name: Build
        working-directory: apps/api
        run: npm run build
